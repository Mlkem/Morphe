name: Niagara emulator acceptance
on:
  push:
    branches: [dev]
    paths:
      - 'extensions/niagara/**'
      - 'patches/src/main/kotlin/ca/mlkem/niagara/**'
      - 'tests/niagara/**'
      - 'scripts/test_niagara*'
      - '.github/workflows/niagara-device.yml'
  pull_request:
    paths:
      - 'extensions/niagara/**'
      - 'patches/src/main/kotlin/ca/mlkem/niagara/**'
      - 'tests/niagara/**'
      - 'scripts/test_niagara*'
      - '.github/workflows/niagara-device.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  niagara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.16.38', '1.16.39']
    env:
      NIAGARA_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and patch official Niagara
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon
          python3 scripts/test_niagara_logic.py
          python3 scripts/test_niagara_apk.py --version "$NIAGARA_VERSION"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tests/niagara/device/run.py build/niagara-apk-validation/${{ env.NIAGARA_VERSION }}/auto/niagara-patched-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: niagara-acceptance-${{ matrix.version }}
          path: |
            build/niagara-apk-validation/${{ env.NIAGARA_VERSION }}/auto/validation.json
            build/niagara-device/*.xml
            build/niagara-device/*.png
            build/niagara-device/*.txt
            build/niagara-device/result.json
